# =============================================================================
# MLRunX CI — Runs on every push and PR
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Repository hygiene
  # ---------------------------------------------------------------------------
  hygiene:
    name: Hygiene (No Merge Markers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on unresolved merge conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo "::error::Found unresolved merge conflict markers."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Security guardrails
  # ---------------------------------------------------------------------------
  security-guards:
    name: Security Guards (Public Env + Secret Patterns)
    runs-on: ubuntu-latest
    needs: [hygiene]
    steps:
      - uses: actions/checkout@v4

      - name: Run repository security guard
        run: python3 scripts/security/ci_guard.py

  # ---------------------------------------------------------------------------
  # Proto/API contract checks
  # ---------------------------------------------------------------------------
  contracts:
    name: Contracts (Buf)
    runs-on: ubuntu-latest
    needs: [hygiene, security-guards]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1

      - name: Lint proto definitions
        run: buf lint

      - name: Check breaking proto changes
        run: buf breaking --against '.git#branch=main'

  # ---------------------------------------------------------------------------
  # Dependency security audits (informational)
  # ---------------------------------------------------------------------------
  security:
    name: Security Audits
    runs-on: ubuntu-latest
    needs: [hygiene, security-guards]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Rust advisory audit
        run: cargo audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix apps/ui

      - name: npm advisory audit
        run: npm --prefix apps/ui audit --audit-level=high

  # ---------------------------------------------------------------------------
  # Rust API: build + test
  # ---------------------------------------------------------------------------
  api:
    name: API (Rust)
    runs-on: ubuntu-latest
    needs: [hygiene, security-guards, contracts]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --bin mlrunx-api

      - name: Run tests
        run: cargo test --release --bin mlrunx-api

  # ---------------------------------------------------------------------------
  # UI: build check
  # ---------------------------------------------------------------------------
  ui:
    name: UI (Next.js)
    runs-on: ubuntu-latest
    needs: [hygiene, security-guards, contracts]
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
