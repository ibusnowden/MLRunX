# MLRunX Nightly CI Pipeline
# Runs integration tests and benchmarks every night
# See: /docs/testing.md for test strategy

name: Nightly

on:
  schedule:
    # Run at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: 'Run performance benchmarks'
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ===========================================================================
  # Integration Tests
  # ===========================================================================

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mlrunx
          POSTGRES_USER: mlrunx
          POSTGRES_PASSWORD: mlrunx_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        ports:
          - 9001:9000
        env:
          MINIO_ROOT_USER: mlrunx
          MINIO_ROOT_PASSWORD: mlrunx_dev_secret
        options: >-
          --health-cmd "mc ready local"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Build services
        run: cargo build --release

      - name: Run integration tests
        run: make test-integration
        env:
          DATABASE_URL: postgres://mlrunx:mlrunx_dev@localhost:5432/mlrunx
          CLICKHOUSE_URL: http://localhost:8123
          REDIS_URL: redis://localhost:6379
          MINIO_ENDPOINT: localhost:9001
          MINIO_ACCESS_KEY: mlrunx
          MINIO_SECRET_KEY: mlrunx_dev_secret

  # ===========================================================================
  # Performance Benchmarks
  # ===========================================================================

  bench-w1:
    name: Benchmark W1 (Query at Scale)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_benchmarks != 'false' }}
    needs: [test-integration]
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports:
          - 8123:8123
          - 9000:9000

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mlrunx
          POSTGRES_USER: mlrunx
          POSTGRES_PASSWORD: mlrunx_dev
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Build API
        run: cargo build --release --bin mlrunx-api

      - name: Run W1 benchmark and threshold check
        run: |
          set -euo pipefail
          DB_PATH="/tmp/mlrunx-w1-${RANDOM}.db"
          MLRUNX_AUTH_DISABLED=true MLRUNX_SQLITE_PATH="$DB_PATH" API_HOST=127.0.0.1 API_HTTP_PORT=3001 API_GRPC_PORT=50051 \
            ./target/release/mlrunx-api > /tmp/mlrunx-api-w1.log 2>&1 &
          API_PID=$!

          cleanup() {
            kill "$API_PID" >/dev/null 2>&1 || true
            wait "$API_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/health >/dev/null

          uv run python -m bench.workloads.w1_run_scale_runner \
            --scale nightly \
            --server-url http://127.0.0.1:3001 \
            --output bench/results/w1_nightly.json

          uv run python bench/run_nightly.py check-threshold \
            --results bench/results/w1_nightly.json \
            --thresholds bench/ci_thresholds.yaml

  bench-w2:
    name: Benchmark W2 (High-Freq Ingest)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_benchmarks != 'false' }}
    needs: [test-integration]
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports:
          - 8123:8123
          - 9000:9000

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Build API
        run: cargo build --release --bin mlrunx-api

      - name: Run W2 benchmark and threshold check
        run: |
          set -euo pipefail
          DB_PATH="/tmp/mlrunx-w2-${RANDOM}.db"
          MLRUNX_AUTH_DISABLED=true MLRUNX_SQLITE_PATH="$DB_PATH" API_HOST=127.0.0.1 API_HTTP_PORT=3001 API_GRPC_PORT=50051 \
            ./target/release/mlrunx-api > /tmp/mlrunx-api-w2.log 2>&1 &
          API_PID=$!

          cleanup() {
            kill "$API_PID" >/dev/null 2>&1 || true
            wait "$API_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/health >/dev/null

          uv run python -m bench.workloads.w2_ingest_latency_runner \
            --scale nightly \
            --server-url http://127.0.0.1:3001 \
            --output bench/results/w2_nightly.json

          uv run python bench/run_nightly.py check-threshold \
            --results bench/results/w2_nightly.json \
            --thresholds bench/ci_thresholds.yaml

  bench-w3:
    name: Benchmark W3 (Mixed Dashboard)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_benchmarks != 'false' }}
    needs: [test-integration]
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports:
          - 8123:8123

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mlrunx
          POSTGRES_USER: mlrunx
          POSTGRES_PASSWORD: mlrunx_dev
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Build API
        run: cargo build --release --bin mlrunx-api

      - name: Run W3 benchmark and threshold check
        run: |
          set -euo pipefail
          DB_PATH="/tmp/mlrunx-w3-${RANDOM}.db"
          MLRUNX_AUTH_DISABLED=true MLRUNX_SQLITE_PATH="$DB_PATH" API_HOST=127.0.0.1 API_HTTP_PORT=3001 API_GRPC_PORT=50051 \
            ./target/release/mlrunx-api > /tmp/mlrunx-api-w3.log 2>&1 &
          API_PID=$!

          cleanup() {
            kill "$API_PID" >/dev/null 2>&1 || true
            wait "$API_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/health >/dev/null

          uv run python -m bench.workloads.w3_mixed_dashboard_runner \
            --scale nightly \
            --server-url http://127.0.0.1:3001 \
            --output bench/results/w3_nightly.json

          uv run python bench/run_nightly.py check-threshold \
            --results bench/results/w3_nightly.json \
            --thresholds bench/ci_thresholds.yaml

  # ===========================================================================
  # Summary & Notification
  # ===========================================================================

  nightly-summary:
    name: Nightly Summary
    runs-on: ubuntu-latest
    needs: [test-integration, bench-w1, bench-w2, bench-w3]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Nightly Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.test-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmark W1 | ${{ needs.bench-w1.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmark W2 | ${{ needs.bench-w2.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmark W3 | ${{ needs.bench-w3.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Check for failures
        if: |
          needs.test-integration.result == 'failure' ||
          needs.bench-w1.result == 'failure' ||
          needs.bench-w2.result == 'failure' ||
          needs.bench-w3.result == 'failure'
        run: |
          echo "::error::One or more nightly jobs failed"
          # Add Slack notification here when configured
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"MLRunX nightly build failed!"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
          exit 1
