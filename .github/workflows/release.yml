# =============================================================================
# MLRunX Release CI
#
# Triggered on version tags (v*). Builds and publishes:
# 1. Docker image to GitHub Container Registry (ghcr.io)
# 2. Pre-built binaries as GitHub Release assets
# 3. Python SDK distributions to PyPI + GitHub Release assets
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository_owner }}/mlrunx-api
  UI_IMAGE_NAME: ${{ github.repository_owner }}/mlrunx-ui
  UI_NEXT_PUBLIC_API_URL: https://mlrunx.example.com

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Build and push Docker image
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.ui
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.UI_IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.UI_IMAGE_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.UI_NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Build release binaries for Linux and macOS
  # ---------------------------------------------------------------------------
  binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: mlrunx-api-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: mlrunx-api-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: mlrunx-api-macos-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: mlrunx-api-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protobuf compiler
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          else
            brew install protobuf
          fi

      - name: Install cross-compilation tools (ARM64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build release binary
        run: cargo build --release --bin mlrunx-api --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mlrunx-api dist/${{ matrix.artifact }}
          chmod +x dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  # ---------------------------------------------------------------------------
  # Build, test, and package Python SDK distributions
  # ---------------------------------------------------------------------------
  python-packages:
    name: Python Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Verify tag matches SDK versions
        run: |
          python - <<'PY'
          import pathlib
          import tomllib
          import os
          import sys

          tag = os.environ["GITHUB_REF"].removeprefix("refs/tags/v")
          sdk_pyproject = pathlib.Path("sdks/python/pyproject.toml")
          integrations_pyproject = pathlib.Path("sdks/integrations/pyproject.toml")

          sdk_version = tomllib.loads(sdk_pyproject.read_text())["project"]["version"]
          integrations_version = tomllib.loads(integrations_pyproject.read_text())["project"]["version"]

          if sdk_version != tag:
              print(f"sdks/python version {sdk_version} does not match tag {tag}")
              sys.exit(1)
          if integrations_version != tag:
              print(f"sdks/integrations version {integrations_version} does not match tag {tag}")
              sys.exit(1)

          print(f"Tag/version match: {tag}")
          PY

      - name: Install workspace dependencies
        run: uv sync --all-packages

      - name: Run SDK test suites
        run: |
          uv run pytest sdks/python/tests -q
          uv run pytest sdks/integrations/tests -q

      - name: Build Python distributions
        run: uv build --all-packages --out-dir dist/python --sdist --wheel --clear

      - name: Validate Python distribution artifacts
        run: |
          ls -1 dist/python
          python - <<'PY'
          import pathlib
          import sys

          dist = pathlib.Path("dist/python")
          files = [p.name for p in dist.glob("*")]
          required_prefixes = ("mlrunx-", "mlrunx_integrations-")
          missing = [
              prefix for prefix in required_prefixes
              if not any(name.startswith(prefix) for name in files)
          ]
          if missing:
              print(f"Missing expected package artifacts: {missing}")
              sys.exit(1)
          print("Found both mlrunx and mlrunx-integrations distributions.")
          PY

      - name: Upload Python package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dists
          path: dist/python/*

  # ---------------------------------------------------------------------------
  # Publish Python packages to PyPI (Trusted Publishing)
  # ---------------------------------------------------------------------------
  pypi-publish:
    name: PyPI Publish
    needs: [python-packages]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download Python package artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dists
          path: dist/python

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python
          skip-existing: true

  # ---------------------------------------------------------------------------
  # Create GitHub Release with binaries
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [docker, binaries, python-packages, pypi-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mlrunx-api-*
          merge-multiple: true
          path: dist

      - name: Download Python package artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dists
          path: dist/python

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
