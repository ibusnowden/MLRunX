# MLRunX manual release validation
# Runs integration tests and release-scale benchmarks before tagging

name: Release Validation

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build API
        run: cargo build --release --bin mlrunx-api

      - name: Run integration tests
        run: MLRUNX_API_BIN=./target/release/mlrunx-api MLRUNX_API_HEALTH_TIMEOUT_SECS=120 make test-integration

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-integration
          path: /tmp/mlrunx-api-integration.log
          if-no-files-found: warn

  benchmarks:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workload: w1
            label: Release Benchmark W1 (Query at Scale)
          - workload: w2
            label: Release Benchmark W2 (High-Freq Ingest)
          - workload: w3
            label: Release Benchmark W3 (Mixed Dashboard)

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}

      - name: Install benchmark dependencies
        run: uv sync --all-packages --frozen

      - name: Build API
        run: cargo build --release --bin mlrunx-api

      - name: Run release benchmark
        id: benchmark
        continue-on-error: true
        run: ./scripts/perf/run_benchmark_check.sh --workload ${{ matrix.workload }} --scale release --api-bin ./target/release/mlrunx-api --health-timeout 120

      - name: Capture benchmark status
        if: always()
        run: |
          mkdir -p benchmark-status
          cat <<EOF > benchmark-status/status-${{ matrix.workload }}.json
          {"workload":"${{ matrix.workload }}","label":"${{ matrix.label }}","status":"${{ steps.benchmark.outcome }}"}
          EOF

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-bench-${{ matrix.workload }}
          path: |
            bench/results/${{ matrix.workload }}_release.json
            /tmp/mlrunx-api-${{ matrix.workload }}-release.log
            benchmark-status/status-${{ matrix.workload }}.json
          if-no-files-found: warn

      - name: Fail on benchmark failure
        if: steps.benchmark.outcome != 'success'
        run: exit 1

  release-validation-summary:
    name: Release Validation Summary
    runs-on: ubuntu-latest
    needs: [test-integration, benchmarks]
    if: always()
    env:
      INTEGRATION_RESULT: ${{ needs.test-integration.result }}
      BENCHMARKS_RESULT: ${{ needs.benchmarks.result }}
    steps:
      - name: Download benchmark status artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: release-validation-bench-*
          path: release-validation-artifacts
          merge-multiple: true

      - name: Summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          labels = {
              "w1": "Release Benchmark W1 (Query at Scale)",
              "w2": "Release Benchmark W2 (High-Freq Ingest)",
              "w3": "Release Benchmark W3 (Mixed Dashboard)",
          }
          statuses = {workload: "skipped" for workload in labels}
          for path in Path("release-validation-artifacts").glob("status-*.json"):
              payload = json.loads(path.read_text(encoding="utf-8"))
              statuses[payload["workload"]] = payload["status"]

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = [
              "## Release Validation Results",
              "",
              "| Job | Status |",
              "|-----|--------|",
              f"| Integration Tests | {os.environ['INTEGRATION_RESULT']} |",
          ]
          for workload in ("w1", "w2", "w3"):
              lines.append(f"| {labels[workload]} | {statuses[workload]} |")
          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Check for failures
        run: |
          if [ "${INTEGRATION_RESULT}" = "failure" ] || [ "${INTEGRATION_RESULT}" = "cancelled" ] || [ "${BENCHMARKS_RESULT}" = "failure" ] || [ "${BENCHMARKS_RESULT}" = "cancelled" ]; then
            echo "::error::Release validation failed"
            exit 1
          fi
