# MLRunX Benchmark CI Thresholds
# See: BENCH-000 specification
#
# This file defines performance thresholds for CI benchmarks.
# Nightly and release workflows check against these values.

version: 2

# Workload thresholds (all values in milliseconds unless noted)
workloads:
  w1_run_scale:
    # Query performance at scale
    list_runs:
      p95_ms: 200
      p99_ms: 500
    filter_tag:
      p95_ms: 150
      p99_ms: 400
    filter_status:
      p95_ms: 150
      p99_ms: 400
    search:
      p95_ms: 200
      p99_ms: 500
    compare_runs:
      p95_ms: 300
      p99_ms: 800

  w2_ingest_latency:
    # High-frequency ingestion
    sdk_enqueue_us:
      p95: 50
      p99: 200
    log_to_visible_ms:
      p95: 500
      p99: 1000
    ingest_rpc_ms:
      p95: 100
      p99: 300

  w3_mixed:
    # Mixed dashboard workload
    dashboard_load:
      p95_ms: 300
      p99_ms: 800
    list_runs:
      p95_ms: 220
      p99_ms: 600
    run_detail:
      p95_ms: 180
      p99_ms: 450
    metrics_series:
      p95_ms: 200
      p99_ms: 500
    compare_runs:
      p95_ms: 280
      p99_ms: 700

# Command-level SLOs by scale.
#
# These entries power per-command reporting and launch-gate checks.
command_slos:
  runs.list:
    workload: w1_run_scale
    metric: list_runs
    targets:
      nightly:
        p95_ms: 200
        p99_ms: 500
      release:
        p95_ms: 150
        p99_ms: 300

  runs.filter_tag:
    workload: w1_run_scale
    metric: filter_tag
    targets:
      nightly:
        p95_ms: 150
        p99_ms: 400
      release:
        p95_ms: 120
        p99_ms: 250

  runs.filter_status:
    workload: w1_run_scale
    metric: filter_status
    targets:
      nightly:
        p95_ms: 150
        p99_ms: 400
      release:
        p95_ms: 120
        p99_ms: 250

  runs.search:
    workload: w1_run_scale
    metric: search
    targets:
      nightly:
        p95_ms: 200
        p99_ms: 500
      release:
        p95_ms: 150
        p99_ms: 300

  runs.compare:
    workload: w1_run_scale
    metric: compare_runs
    targets:
      nightly:
        p95_ms: 300
        p99_ms: 800
      release:
        p95_ms: 200
        p99_ms: 450

  ingest.sdk_enqueue:
    workload: w2_ingest_latency
    metric: sdk_enqueue_us
    targets:
      nightly:
        p95: 50
        p99: 200
      release:
        p95: 40
        p99: 150

  ingest.rpc:
    workload: w2_ingest_latency
    metric: ingest_rpc_ms
    targets:
      nightly:
        p95: 100
        p99: 300
      release:
        p95: 80
        p99: 220

  ingest.log_to_visible:
    workload: w2_ingest_latency
    metric: log_to_visible_ms
    targets:
      nightly:
        p95: 500
        p99: 1000
      release:
        p95: 350
        p99: 700

  dashboard.load:
    workload: w3_mixed
    metric: dashboard_load
    targets:
      nightly:
        p95_ms: 300
        p99_ms: 800
      release:
        p95_ms: 200
        p99_ms: 450

  dashboard.list_runs:
    workload: w3_mixed
    metric: list_runs
    targets:
      nightly:
        p95_ms: 220
        p99_ms: 600
      release:
        p95_ms: 160
        p99_ms: 350

  dashboard.run_detail:
    workload: w3_mixed
    metric: run_detail
    targets:
      nightly:
        p95_ms: 180
        p99_ms: 450
      release:
        p95_ms: 140
        p99_ms: 280

  dashboard.metrics_series:
    workload: w3_mixed
    metric: metrics_series
    targets:
      nightly:
        p95_ms: 200
        p99_ms: 500
      release:
        p95_ms: 150
        p99_ms: 320

  dashboard.compare_runs:
    workload: w3_mixed
    metric: compare_runs
    targets:
      nightly:
        p95_ms: 280
        p99_ms: 700
      release:
        p95_ms: 190
        p99_ms: 420

# Launch gates evaluated in release benchmark runs.
launch_gates:
  release:
    max_threshold_violations: 0
    required_commands:
      - runs.list
      - runs.filter_tag
      - runs.filter_status
      - runs.search
      - runs.compare
      - ingest.rpc
      - ingest.log_to_visible
      - dashboard.load
      - dashboard.list_runs
      - dashboard.run_detail
      - dashboard.metrics_series
      - dashboard.compare_runs
    command_slo_pass_rate_percent: 100

# Regression detection policy
regression:
  # Percentage above threshold that triggers regression alert
  allowable_deviation_percent: 20

  # Number of consecutive failures before alert
  consecutive_failures: 2

  # Window for baseline calculation (days)
  baseline_window_days: 7

  # Minimum samples required for valid baseline
  min_baseline_samples: 3

# Scale configurations for different CI contexts
scale:
  # Nightly CI (fast, lower data volume)
  nightly:
    w1:
      runs: 1000
      queries_per_type: 100
    w2:
      duration_s: 30
      frequency_hz: 10
    w3:
      concurrent_users: 5
      duration_s: 30

  # Release gate (full scale)
  release:
    w1:
      runs: 10000
      queries_per_type: 100
    w2:
      duration_s: 300
      frequency_hz: 10
    w3:
      concurrent_users: 50
      duration_s: 60

  # Stress testing (optional, manual)
  stress:
    w1:
      runs: 100000
      queries_per_type: 1000
    w2:
      duration_s: 600
      frequency_hz: 100
    w3:
      concurrent_users: 200
      duration_s: 300

# Alert configuration
alerts:
  # GitHub Actions annotations
  github:
    enabled: true
    warn_on_approach: true  # Warn when within 80% of threshold
    fail_on_exceed: true

  # Slack notifications (optional)
  slack:
    enabled: false
    webhook_env_var: SLACK_BENCHMARK_WEBHOOK
    channels:
      regression: "#mlrunx-alerts"
      weekly_report: "#mlrunx-perf"

# Output configuration
output:
  # JSON reports
  json:
    enabled: true
    path: bench/results

  # Markdown summary
  markdown:
    enabled: true
    path: bench/results

  # Historical data storage
  history:
    enabled: true
    path: bench/results/history
    retention_days: 90
