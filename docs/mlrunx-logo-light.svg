<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80" fill="none">
  <defs>
    <linearGradient id="icon-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="x-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Icon: abstract pulse/chart line forming an angular shape -->
  <g transform="translate(10, 8)">
    <!-- Outer angular bracket / speed mark -->
    <path d="M8 58 L28 10 L36 28 L48 4 L56 22 L48 22 L44 14 L34 38 L26 20 L14 58 Z"
          fill="url(#icon-grad)" opacity="0.9"/>
    <!-- Reflection / second line -->
    <path d="M18 58 L32 24 L38 36 L50 12"
          stroke="url(#icon-grad)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4"/>
    <!-- Base line -->
    <line x1="2" y1="58" x2="60" y2="58" stroke="#3B82F6" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Wordmark — single text element so glyphs flow naturally -->
  <text x="82" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="52" letter-spacing="-1">
    <tspan font-weight="700" fill="#0F172A">ML</tspan><tspan font-weight="400" fill="#334155">Run</tspan><tspan font-weight="700" fill="url(#x-grad)">X</tspan>
  </text>
</svg>
