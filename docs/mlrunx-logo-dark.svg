<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80" fill="none">
  <defs>
    <linearGradient id="icon-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="x-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Icon: abstract pulse/chart line forming an angular shape -->
  <g transform="translate(10, 8)">
    <!-- Outer angular bracket / speed mark -->
    <path d="M8 58 L28 10 L36 28 L48 4 L56 22 L48 22 L44 14 L34 38 L26 20 L14 58 Z"
          fill="url(#icon-grad)" opacity="0.9"/>
    <!-- Reflection / second line -->
    <path d="M18 58 L32 24 L38 36 L50 12"
          stroke="url(#icon-grad)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4"/>
    <!-- Base line -->
    <line x1="2" y1="58" x2="60" y2="58" stroke="#60A5FA" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(82, 0)">
    <!-- "ML" in bold -->
    <text x="0" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="52" font-weight="700" fill="#F1F5F9" letter-spacing="-1">ML</text>
    <!-- "Run" in regular weight -->
    <text x="82" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="52" font-weight="400" fill="#CBD5E1" letter-spacing="-1">Run</text>
    <!-- "X" in accent color -->
    <text x="193" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="52" font-weight="700" fill="url(#x-grad)" letter-spacing="-1">X</text>
  </g>
</svg>
