invariants:
  - id: AUTH-001
    description: "When MLRUNX_AUTH_MODE=disabled, all protected endpoints must bypass credential checks in middleware."
  - id: AUTH-002
    description: "When MLRUNX_AUTH_MODE=api_key, UI JWT/session paths must remain disabled."
  - id: AUTH-003
    description: "When MLRUNX_AUTH_MODE=hybrid, API key auth and UI JWT/session auth must both be accepted."
  - id: DB-001
    description: "HTTP read/write handlers must not rely on in-memory run metadata as authoritative state."
  - id: DB-002
    description: "SQLite schema bootstrap must record a ledger row in schema_migrations."
  - id: CI-001
    description: "Nightly benchmark jobs must execute real workload runners, not synthetic placeholder values."
  - id: CI-002
    description: "Required lint/test gates must fail hard (no soft-fail wrappers that mask regressions)."
  - id: REL-001
    description: "Release workflow publishes both API and UI container images with version and latest tags."

change_policy:
  require_update_on:
    - "Any change in storage readiness classification"
    - "Any new runtime auth mode or auth flag deprecation"
    - "Any release artifact matrix change"
