version: 1
updated_utc: "2026-03-01T00:00:00Z"
owner: "perf-core"
scope:
  objective: "Sub-200ms command responsiveness for compare/list/chart workflows with deterministic launch gates."
  benchmark_source_of_truth:
    - "bench/ci_thresholds.yaml"
    - "bench/run_nightly.py"
    - "bench/workloads/*.py"

slo_table:
  - command: runs.list
    source_workload: w1_run_scale
    source_metric: list_runs
    nightly:
      p95_ms: 200
      p99_ms: 500
    release:
      p95_ms: 150
      p99_ms: 300
  - command: runs.filter_tag
    source_workload: w1_run_scale
    source_metric: filter_tag
    nightly:
      p95_ms: 150
      p99_ms: 400
    release:
      p95_ms: 120
      p99_ms: 250
  - command: runs.filter_status
    source_workload: w1_run_scale
    source_metric: filter_status
    nightly:
      p95_ms: 150
      p99_ms: 400
    release:
      p95_ms: 120
      p99_ms: 250
  - command: runs.search
