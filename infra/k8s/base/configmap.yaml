apiVersion: v1
kind: ConfigMap
metadata:
  name: mlrunx-config
  namespace: mlrunx
  labels:
    app.kubernetes.io/name: mlrunx
    app.kubernetes.io/component: config
data:
  # Database configuration
  CLICKHOUSE_HOST: "clickhouse"
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_USER: "mlrunx"
  CLICKHOUSE_DATABASE: "mlrunx"

  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "mlrunx"
  POSTGRES_DATABASE: "mlrunx"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_BUCKET: "mlrunx-artifacts"
  MINIO_REGION: "us-east-1"

  # API configuration
  API_HOST: "0.0.0.0"
  API_HTTP_PORT: "3001"
  API_GRPC_PORT: "50051"
  RUST_LOG: "info,mlrunx_api=debug"
  INGEST_MODE: "direct"

  # Privacy settings (all disabled by default)
  MLRUNX_TELEMETRY_DISABLED: "true"
  MLRUNX_CRASH_REPORTING_DISABLED: "true"
  MLRUNX_ANALYTICS_DISABLED: "true"
  MLRUNX_UPDATE_CHECK_DISABLED: "true"

  # Retention settings
  MLRUNX_METRICS_RETENTION_DAYS: "90"
  MLRUNX_ARTIFACTS_RETENTION_DAYS: "365"
  MLRUNX_LOGS_RETENTION_DAYS: "7"
---
apiVersion: v1
kind: Secret
metadata:
  name: mlrunx-secrets
  namespace: mlrunx
  labels:
    app.kubernetes.io/name: mlrunx
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Replace these with secure values in production!
  CLICKHOUSE_PASSWORD: "mlrunx_dev"
  POSTGRES_PASSWORD: "mlrunx_dev"
  MINIO_ACCESS_KEY: "mlrunx"
  MINIO_SECRET_KEY: "mlrunx_dev_secret"
  MLRUNX_API_KEY: ""  # Generate: openssl rand -hex 32
